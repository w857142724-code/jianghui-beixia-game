<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>小回和北夏的小窝 V2</title>
<style>
:root{
  --ink:#3f3732; --muted:#7b6f68; --glass:rgba(255,251,243,.84);
  --shadow:0 18px 52px rgba(59,45,36,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#ece7dd;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
button{font:inherit}
.app{
  width:min(100vw,470px);height:100dvh;margin:auto;position:relative;overflow:hidden;
  background:linear-gradient(#b9d9e2,#f7deb0 60%,#8aa16d 60%);
  box-shadow:0 0 50px rgba(0,0,0,.16);
  transition:background 1.2s ease,filter .8s ease;
}
.app.dawn{background:linear-gradient(#bfdbe3,#f6d7ae 60%,#8a9e70 60%)}
.app.noon{background:linear-gradient(#9fdbe8,#f6efb7 60%,#85a36c 60%)}
.app.sunset{background:linear-gradient(#c8a0aa,#f3b36f 60%,#7d8b61 60%)}
.app.night{background:linear-gradient(#263950,#52647a 60%,#4f684e 60%)}
.app.rain{filter:saturate(.88) brightness(.94)}
.sky{position:absolute;inset:0 0 40% 0;overflow:hidden}
.sun,.moon{position:absolute;border-radius:50%;transition:all 1.1s ease}
.sun{width:82px;height:82px;left:15%;top:30%;background:radial-gradient(circle at 35% 35%,#fffbdc 0 15%,#ffd36b 45%,#efa25a 100%);box-shadow:0 0 45px rgba(255,207,108,.38)}
.moon{width:66px;height:66px;right:16%;top:13%;background:#edf1df;box-shadow:0 0 28px rgba(240,244,218,.2);opacity:0}
.stars{position:absolute;inset:0;opacity:0;transition:opacity .8s;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#fff 0 1px,transparent 1.5px);background-size:73px 79px,97px 107px,127px 91px;background-position:8px 4px,45px 22px,18px 37px}
.app.night .stars{opacity:.85}.app.night .sun{opacity:0}.app.night .moon{opacity:1}
.cloud{position:absolute;width:82px;height:24px;background:rgba(255,255,255,.5);border-radius:30px}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:32px;height:32px;left:11px;top:-15px}.cloud:after{width:41px;height:41px;right:8px;top:-21px}
.c1{left:5%;top:18%;animation:cloud1 24s linear infinite}.c2{right:5%;top:34%;transform:scale(.8);animation:cloud2 30s linear infinite}
@keyframes cloud1{50%{transform:translateX(34px)}} @keyframes cloud2{50%{transform:translateX(-28px) scale(.8)}}
.hill{position:absolute;left:-12%;right:-12%;bottom:35%;height:30%;border-radius:50% 50% 0 0/70% 70% 0 0;background:linear-gradient(#7f9970,#5f7856);opacity:.9}
.ground{position:absolute;left:0;right:0;bottom:0;height:49%;background:linear-gradient(#718f61,#5d7954)}
.house{position:absolute;left:4%;right:4%;bottom:12%;height:59%;background:linear-gradient(#a77b5c,#7d5840);border-radius:44% 44% 18% 18%/28% 28% 15% 15%;box-shadow:inset 0 0 0 5px rgba(76,53,42,.17),0 18px 40px rgba(43,38,34,.23);overflow:hidden}
.house:before{content:"";position:absolute;left:-9%;right:-9%;top:-9%;height:24%;background:radial-gradient(ellipse at 50% 100%,#694a38 0 58%,transparent 60%),linear-gradient(#73523e,#604331);border-radius:50%}
.window{position:absolute;left:8%;top:18%;width:35%;height:27%;background:rgba(191,224,232,.85);border:8px solid #5f4435;border-radius:16px;overflow:hidden}
.app.night .window{background:#415367}
.window:before,.window:after{content:"";position:absolute;background:#5f4435}
.window:before{left:48%;top:0;bottom:0;width:5px}.window:after{top:48%;left:0;right:0;height:5px}
.rainPane{position:absolute;inset:0;opacity:0;pointer-events:none;background:repeating-linear-gradient(100deg,transparent 0 9px,rgba(255,255,255,.45) 10px 11px,transparent 12px 18px);animation:rainMove .6s linear infinite}
.app.rain .rainPane{opacity:.65}@keyframes rainMove{to{background-position:-18px 40px}}
.curtain{position:absolute;left:5%;top:15%;width:43%;height:34%;pointer-events:none}.curtain:before,.curtain:after{content:"";position:absolute;top:0;width:38%;height:100%;background:#dcc6a1;border-radius:10px 10px 24px 24px;opacity:.92}.curtain:before{left:0;transform:rotate(4deg)}.curtain:after{right:0;transform:rotate(-4deg)}
.shelf{position:absolute;right:8%;top:22%;width:38%;height:10px;background:#5a3c2f;border-radius:4px;box-shadow:0 52px 0 #5a3c2f}
.jar{position:absolute;top:-28px;width:26px;height:28px;border-radius:8px 8px 11px 11px;background:#d7c8a3;border:3px solid #6e4e39}.j1{left:7px}.j2{left:50px;background:#b8c6a3}.j3{left:93px;background:#d8a787}
.bed{position:absolute;left:5%;bottom:7%;width:51%;height:24%;background:#c9a57d;border-radius:45% 45% 18px 18px;box-shadow:inset 0 -12px 0 rgba(115,80,58,.15)}.bed:after{content:"";position:absolute;left:10%;right:9%;bottom:16%;height:39%;background:#ead8b7;border-radius:50% 50% 25px 25px}
.mat{position:absolute;right:7%;bottom:8%;width:34%;height:16%;background:#6d5c4d;border-radius:50%;opacity:.9}
.door{position:absolute;right:5%;top:40%;width:28%;height:48%;background:#49362e;border-radius:70px 70px 8px 8px;box-shadow:inset 0 0 0 5px rgba(255,255,255,.05)}.door:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#ba955f;right:14px;top:52%}
.lamp{position:absolute;right:38%;top:50%;width:29px;height:45px;background:#f2d27d;border-radius:15px 15px 8px 8px;box-shadow:0 0 25px rgba(255,216,114,.4);opacity:.65}.lamp:after{content:"";position:absolute;left:11px;top:43px;width:6px;height:27px;background:#614735}.app.night .lamp{opacity:1;box-shadow:0 0 55px rgba(255,216,114,.58)}
.rug{position:absolute;left:31%;bottom:2%;width:40%;height:17%;background:#9d7962;border-radius:50%;opacity:.86}
.blanket{position:absolute;left:11%;bottom:9%;width:32%;height:11%;background:#ead9bb;border-radius:50%;transform:rotate(-4deg);opacity:.8}
.object{position:absolute;z-index:4;pointer-events:none}
.apple{left:40%;bottom:19%;font-size:24px;opacity:0;transition:.3s}.apple.show{opacity:1;transform:translateY(-4px)}
.toy{left:43%;bottom:10%;font-size:23px;opacity:.55}

.topbar{position:absolute;z-index:30;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;align-items:center}
.brand,.clock,.weatherBtn{backdrop-filter:blur(14px);background:var(--glass);border:1px solid rgba(255,255,255,.54);box-shadow:var(--shadow);border-radius:18px}
.brand{padding:10px 13px;font-weight:800;flex:1;min-width:0}.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{padding:8px 10px;font-size:11px;text-align:center;min-width:65px}.clock b{display:block;font-size:14px}
.weatherBtn{border:0;padding:10px 11px;font-size:17px;color:var(--ink)}
.phasebar{position:absolute;z-index:29;left:14px;right:14px;top:calc(74px + env(safe-area-inset-top));display:flex;gap:6px;background:rgba(255,255,255,.44);backdrop-filter:blur(12px);padding:6px;border-radius:18px;border:1px solid rgba(255,255,255,.4)}
.phasebar button{flex:1;border:0;background:transparent;border-radius:13px;padding:8px 2px;font-size:12px;color:#685e57}.phasebar button.active{background:rgba(255,255,255,.9);font-weight:800;box-shadow:0 4px 14px rgba(60,48,40,.1)}
.tip{position:absolute;z-index:24;left:50%;top:calc(122px + env(safe-area-inset-top));transform:translateX(-50%);font-size:11px;color:rgba(58,50,46,.72);background:rgba(255,255,255,.57);padding:6px 10px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(10px)}

.animal{position:absolute;z-index:12;width:132px;height:132px;cursor:pointer;user-select:none;filter:drop-shadow(0 10px 11px rgba(39,34,29,.16));transition:left 2.1s cubic-bezier(.25,.8,.25,1),right 2.1s cubic-bezier(.25,.8,.25,1),bottom 2.1s cubic-bezier(.25,.8,.25,1),transform .35s ease}
.animal svg{width:100%;height:100%;overflow:visible}
.fox{left:18%;bottom:21%;animation:breathe 3.6s ease-in-out infinite}
.wolf{right:8%;bottom:16%;width:154px;height:154px;animation:breathe 4.3s ease-in-out infinite reverse}
@keyframes breathe{50%{transform:translateY(2px) scale(1.012)}}
.bounce{animation:bounce .48s ease 1!important}@keyframes bounce{50%{transform:translateY(-10px) scale(1.04)}}
.nudge{animation:nudge .6s ease 1!important}@keyframes nudge{50%{transform:translateX(-12px)}}
.sleepy{transform:scaleY(.96) translateY(4px)!important;filter:drop-shadow(0 8px 10px rgba(39,34,29,.14)) brightness(.96)}
.hiddenFox{left:6%!important;bottom:11%!important}.windowFox{left:10%!important;bottom:41%!important}.doorFox{left:55%!important;bottom:14%!important}.nearWolfFox{left:49%!important;bottom:17%!important}
.doorWolf{right:3%!important;bottom:15%!important}.matWolf{right:8%!important;bottom:11%!important}.nearFoxWolf{right:34%!important;bottom:17%!important}.windowWolf{right:46%!important;bottom:35%!important}
.z{position:absolute;z-index:15;font-size:18px;opacity:0;pointer-events:none}.z.show{animation:zfloat 2s ease forwards}@keyframes zfloat{0%{opacity:0;transform:translate(0,5px)}20%{opacity:1}100%{opacity:0;transform:translate(12px,-42px)}}

.hotspot{position:absolute;z-index:16;background:transparent;border:0;padding:0}
.foxPaw{left:25%;bottom:21%;width:64px;height:46px}.foxTail{left:8%;bottom:19%;width:96px;height:82px}.wolfChain{right:18%;bottom:25%;width:80px;height:44px}.wolfChest{right:15%;bottom:17%;width:98px;height:72px}

.bubble{position:absolute;z-index:50;left:7%;right:7%;bottom:8.6%;min-height:82px;background:rgba(255,250,239,.95);backdrop-filter:blur(16px);border:1px solid rgba(117,86,68,.13);border-radius:22px;box-shadow:var(--shadow);padding:14px 17px;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none}
.bubble.show{opacity:1;transform:translateY(0)}.speaker{font-size:12px;color:#986a54;font-weight:800;margin-bottom:5px}.line{font-size:15px;line-height:1.5}.note{font-size:11px;color:#8a7d76;margin-top:7px}
.toast{position:absolute;z-index:46;left:50%;top:28%;transform:translate(-50%,-12px);padding:8px 13px;border-radius:999px;background:rgba(63,49,41,.76);color:#fff;font-size:12px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.toolbar{position:absolute;z-index:55;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px}.toolbar button{flex:1;border:0;border-radius:18px;padding:12px 6px;background:rgba(255,255,255,.9);box-shadow:var(--shadow);font-size:12px;color:#514641;font-weight:800}.toolbar button:active{transform:scale(.98)}

.panel{position:absolute;z-index:80;left:6%;right:6%;top:19%;background:rgba(255,250,240,.98);border-radius:24px;padding:18px;box-shadow:0 25px 80px rgba(44,38,33,.28);display:none}.panel.show{display:block}.panel h3{margin:0 0 5px;font-size:17px}.panel p{margin:0 0 13px;font-size:12px;line-height:1.5;color:#7c7068}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{aspect-ratio:1;border:0;border-radius:16px;background:#e7d4ad;font-size:25px;box-shadow:inset 0 -5px 0 rgba(91,67,51,.08)}.status{text-align:center;margin-top:10px;font-size:13px;font-weight:800;color:#6d594c}.close{margin-top:12px;width:100%;border:0;border-radius:14px;padding:10px;background:#5e4b40;color:#fff}
.weatherGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.weatherGrid button{border:0;border-radius:14px;padding:11px;background:#eee2cb;font-size:13px}.weatherGrid button.active{background:#d9c69f;font-weight:800}

.heart{position:absolute;z-index:90;font-size:18px;pointer-events:none;animation:heart 1.1s ease forwards}@keyframes heart{0%{opacity:0;transform:translateY(5px) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translateY(-46px) scale(1.1)}}
.eventTag{position:absolute;z-index:35;right:15px;top:calc(126px + env(safe-area-inset-top));background:rgba(69,56,47,.68);color:#fff;border-radius:999px;padding:6px 10px;font-size:10px;opacity:0;transition:.25s}.eventTag.show{opacity:1}
</style>
</head>
<body>
<div class="app dawn" id="app">
  <div class="sky">
    <div class="stars"></div><div class="sun"></div><div class="moon"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div>
  </div>
  <div class="hill"></div><div class="ground"></div>

  <div class="topbar">
    <div class="brand">小回和北夏的小窝<small id="moodText">今天也有人在等你回来</small></div>
    <div class="clock"><b id="phaseLabel">日出</b><span id="timeLabel">06:40</span></div>
    <button class="weatherBtn" id="weatherBtn">☀️</button>
  </div>

  <div class="phasebar">
    <button data-phase="dawn" class="active">日出</button>
    <button data-phase="noon">正午</button>
    <button data-phase="sunset">日落</button>
    <button data-phase="night">夜晚</button>
  </div>
  <div class="tip">不碰他们也会自己生活一会儿</div>
  <div class="eventTag" id="eventTag">随机事件</div>

  <div class="house">
    <div class="window"><div class="rainPane"></div></div>
    <div class="curtain"></div>
    <div class="shelf"><i class="jar j1"></i><i class="jar j2"></i><i class="jar j3"></i></div>
    <div class="bed"></div><div class="blanket"></div><div class="mat"></div><div class="door"></div><div class="lamp"></div><div class="rug"></div>
    <div class="object apple" id="apple">🍎</div><div class="object toy">🧩</div>
  </div>

  <div class="animal fox" id="fox">
    <svg viewBox="0 0 160 160">
      <path d="M38 114 C3 125,2 82,31 78 C50 75,48 98,28 103 C44 104,58 111,58 127" fill="#cf6238"/>
      <path d="M11 103 C6 94,10 83,26 80 C16 89,18 97,28 103 C22 107,15 108,11 103" fill="#2e2927"/>
      <ellipse cx="86" cy="111" rx="43" ry="34" fill="#d66b3f"/><ellipse cx="88" cy="118" rx="23" ry="22" fill="#f4e3d1"/>
      <path d="M50 70 Q58 32 87 30 Q119 29 129 70 Q123 100 89 104 Q57 100 50 70Z" fill="#dc7449"/>
      <path d="M58 52 L61 16 Q78 28 80 45Z" fill="#d66b3f"/><path d="M105 44 Q111 26 125 15 L121 57Z" fill="#d66b3f"/>
      <path d="M62 38 L63 23 Q70 30 74 42Z" fill="#2a2725"/><path d="M113 38 Q118 26 122 22 L119 45Z" fill="#2a2725"/>
      <ellipse cx="77" cy="70" rx="5" ry="7" fill="#684c1f"/><ellipse cx="102" cy="70" rx="5" ry="7" fill="#684c1f"/>
      <circle cx="78" cy="68" r="1.7" fill="#ffd971"/><circle cx="103" cy="68" r="1.7" fill="#ffd971"/>
      <path d="M86 78 Q90 75 94 78 Q91 83 89 83 Q87 83 86 78" fill="#e7a39e"/><path d="M79 87 Q89 92 99 87" fill="none" stroke="#4d352d" stroke-width="2.3" stroke-linecap="round"/>
      <ellipse cx="72" cy="137" rx="14" ry="9" fill="#d66b3f"/><ellipse cx="108" cy="137" rx="14" ry="9" fill="#d66b3f"/>
      <ellipse cx="72" cy="140" rx="9" ry="5" fill="#2b2827"/><ellipse cx="108" cy="140" rx="9" ry="5" fill="#2b2827"/>
    </svg>
  </div>

  <div class="animal wolf" id="wolf">
    <svg viewBox="0 0 180 180">
      <path d="M139 126 C176 128,177 96,151 89 C166 102,160 112,143 114Z" fill="#292b2f"/>
      <ellipse cx="92" cy="127" rx="49" ry="38" fill="#2c2d31"/>
      <path d="M44 76 Q49 36 86 30 Q127 31 138 76 Q128 107 92 110 Q57 107 44 76Z" fill="#303136"/>
      <path d="M54 54 L56 18 Q74 30 79 47Z" fill="#2d2f33"/><path d="M111 47 Q121 28 135 18 L132 58Z" fill="#2d2f33"/>
      <path d="M58 38 L59 23 Q65 29 70 42Z" fill="#e1dfd8" opacity=".82"/><path d="M122 39 Q128 26 132 23 L130 45Z" fill="#e1dfd8" opacity=".78"/>
      <ellipse cx="79" cy="73" rx="5" ry="7" fill="#203328"/><ellipse cx="106" cy="73" rx="5" ry="7" fill="#203328"/>
      <circle cx="80" cy="70" r="1.7" fill="#789378"/><circle cx="107" cy="70" r="1.7" fill="#789378"/>
      <path d="M88 82 Q92 79 96 82 Q93 87 91 87 Q89 87 88 82" fill="#252326"/><path d="M82 92 Q92 96 102 92" fill="none" stroke="#111214" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M62 100 Q91 115 120 100" fill="none" stroke="#a78b64" stroke-width="4" stroke-dasharray="7 5" stroke-linecap="round"/>
      <path d="M94 121 l8 10 m-2-13 l8 10" stroke="#806d63" stroke-width="2.5" opacity=".8"/>
      <ellipse cx="70" cy="154" rx="16" ry="9" fill="#292a2d"/><ellipse cx="116" cy="154" rx="16" ry="9" fill="#292a2d"/>
    </svg>
  </div>

  <div class="z" id="zFox">Z</div><div class="z" id="zWolf">Z</div>

  <button class="hotspot foxPaw" id="foxPaw"></button><button class="hotspot foxTail" id="foxTail"></button>
  <button class="hotspot wolfChain" id="wolfChain"></button><button class="hotspot wolfChest" id="wolfChest"></button>

  <div class="toast" id="toast"></div>
  <div class="bubble" id="bubble"><div class="speaker" id="speaker"></div><div class="line" id="line"></div><div class="note" id="note"></div></div>

  <div class="panel" id="toyPanel">
    <h3>小回的木块</h3><p>按从小到大的顺序点。小回嘴上说“无聊”，胜负欲已经起来了。</p>
    <div class="tiles" id="tiles"></div><div class="status" id="status"></div><button class="close" id="closeToy">收起来</button>
  </div>

  <div class="panel" id="weatherPanel">
    <h3>今天的天气</h3><p>天气会改变他们自己的行为。雨天尤其容易撞见“窝”的相关事件。</p>
    <div class="weatherGrid">
      <button data-weather="clear" class="active">☀️ 晴</button>
      <button data-weather="rain">🌧️ 雨</button>
      <button data-weather="wind">🍃 风</button>
    </div>
    <button class="close" id="closeWeather">关掉</button>
  </div>

  <div class="toolbar">
    <button id="foodBtn">🍎 带点吃的</button>
    <button id="toyBtn">🧩 给小回玩</button>
    <button id="homeBtn">🪵 收拾小窝</button>
  </div>
</div>

<script>
const app=document.getElementById('app'), fox=document.getElementById('fox'), wolf=document.getElementById('wolf');
const bubble=document.getElementById('bubble'),speaker=document.getElementById('speaker'),line=document.getElementById('line'),note=document.getElementById('note');
const toast=document.getElementById('toast'),tag=document.getElementById('eventTag'),mood=document.getElementById('moodText');
const phaseLabel=document.getElementById('phaseLabel'),timeLabel=document.getElementById('timeLabel'),apple=document.getElementById('apple');
let phase='dawn', weather='clear', sleepingFox=false, sleepingWolf=false, busy=false, lastPair=0;
let bubbleTimer;

const P={
 fox:{
  dawn:[["小回","他已经起来了？","问完又装作只是随口问。"],["小回","再睡五分钟。","鼻尖重新埋进尾巴里。"],["小回","你别吵。","其实是他自己还没醒透。"]],
  noon:[["小回","你又先看他。","耳朵很轻地动了一下。"],["小回","这个位置是我的。","尾巴却往旁边让了一点。"],["小回","我没等他。","身子正对着门口。"]],
  sunset:[["小回","他怎么还没回来。","停两秒：我就是问问。"],["小回","今天风有点大。","低头看了一眼窝门。"],["小回","……别看我。","其实一直在听外面的脚步声。"]],
  night:[["小回","我不困。","下一秒打了个很小的哈欠。"],["小回","外面刚刚是不是有声音。","尾巴悄悄往北夏那边靠。"],["小回","你还不睡？","自己的眼睛已经快睁不开了。"]]
 },
 wolf:{
  dawn:[["北夏","醒了？","他早就守在门边。"],["北夏","别吵他。","小回还缩在窝里。"],["北夏","早饭在那边。","语气像在说一件理所当然的事。"]],
  noon:[["北夏","又怎么了。","看着懒得理你，其实一直在看。"],["北夏","他不饿，他馋。","说完还是把果子推过去。"],["北夏","别惯他。","两秒后：……算了，给他吧。"]],
  sunset:[["北夏","我回来了。","先把带回来的东西放到门边。"],["北夏","风大，进去。","自己却还在门口看了一圈。"],["北夏","怕就过来。","很短的一句，没有再解释。"]],
  night:[["北夏","还不睡？","尾巴轻轻拍了一下地面。"],["北夏","没事，我在。","说完就闭上眼睛。"],["北夏","刚睡着，别闹他。","声音压得很低。"]]
 }
};

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function say(w,t,n=""){clearTimeout(bubbleTimer);speaker.textContent=w;line.textContent=t;note.textContent=n;bubble.classList.add('show');bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),4300)}
function sayFrom(type){say(...pick(P[type][phase]))}
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}
function showTag(t){tag.textContent=t;tag.classList.add('show');setTimeout(()=>tag.classList.remove('show'),1700)}
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),700)}
function heartNear(el,char='♡'){const r=el.getBoundingClientRect(),a=app.getBoundingClientRect(),h=document.createElement('div');h.className='heart';h.textContent=char;h.style.left=(r.left-a.left+r.width*.55)+'px';h.style.top=(r.top-a.top+18)+'px';app.appendChild(h);setTimeout(()=>h.remove(),1200)}
function sleep(el,on,who){el.classList.toggle('sleepy',on);if(who==='fox') sleepingFox=on; else sleepingWolf=on}
function zzz(el,z){const r=el.getBoundingClientRect(),a=app.getBoundingClientRect();z.style.left=(r.left-a.left+r.width*.55)+'px';z.style.top=(r.top-a.top+10)+'px';z.classList.remove('show');void z.offsetWidth;z.classList.add('show')}

fox.onclick=()=>{if(sleepingFox){say("小回","……嗯。","他醒了一点，又往北夏那边缩。");sleep(fox,false,'fox')}else{sayFrom('fox');anim(fox,'bounce');heartNear(fox,'✦')}};
wolf.onclick=()=>{if(sleepingWolf){say("北夏","醒着。","其实刚才明明睡着了。");sleep(wolf,false,'wolf')}else{sayFrom('wolf');anim(wolf,'nudge')}};

document.getElementById('foxPaw').onclick=e=>{e.stopPropagation();showToast('小回“唰”地把爪子藏起来');say(...pick([["小回","……别碰。","黑色肉垫一下就收进胸口底下。"],["小回","不好看。","说完把两只前爪都藏住了。"],["北夏","藏什么。","他在旁边看得很有兴趣。"]]))};
document.getElementById('foxTail').onclick=e=>{e.stopPropagation();say(...pick([["小回","尾巴也不许。","他立刻转过来看你。"],["小回","你怎么这么闲。","尾巴尖却在地上扫了一下。"],["北夏","让你碰了？","听起来像训你，又像故意逗狐狸。"]]))};
document.getElementById('wolfChain').onclick=e=>{e.stopPropagation();say("北夏","链子别动。","他低头看了一眼，爪子不自觉按住它。");showToast('他把链子往胸口拢了拢')};
document.getElementById('wolfChest').onclick=e=>{e.stopPropagation();say(...pick([["北夏","旧伤。没事。","他没躲，只是不想多说。"],["小回","别碰那里。","这次先开口的反而是小回。"],["北夏","看够了？","过两秒，又把身体转回来一点。"]]))};

const phaseNames={dawn:"日出",noon:"正午",sunset:"日落",night:"夜晚"}, phaseTimes={dawn:"06:40",noon:"12:18",sunset:"18:07",night:"23:26"};
document.querySelectorAll('.phasebar button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.phasebar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');phase=b.dataset.phase;
 app.className='app '+phase+(weather==='rain'?' rain':'');phaseLabel.textContent=phaseNames[phase];timeLabel.textContent=phaseTimes[phase];
 sleep(fox,false,'fox');sleep(wolf,false,'wolf');
 if(phase==='night'){say("北夏","灯留着。","小回怕黑这件事，他从来不拿出来说。"); setTimeout(()=>sleepScene(),1300)}
 else if(phase==='sunset') say("小回","天快黑了。","他往门口看了一眼。");
 else if(phase==='dawn') say("北夏","还早。","他把声音压得很低。");
 else say("小回","太阳好亮。","嘴上嫌弃，还是挪到有光的地方。");
});

document.getElementById('foodBtn').onclick=()=>{
 apple.classList.add('show');setTimeout(()=>apple.classList.remove('show'),5000);
 moveFox('nearWolfFox');moveWolf('nearFoxWolf');
 setTimeout(()=>say(...pick([["北夏","给他的。","北夏把一颗小果子放到小回面前。"],["小回","我没说想吃。","下一秒已经叼走了。"],["北夏","慢点。","小回装作没听见。"]])),700)
};
document.getElementById('homeBtn').onclick=()=>{
 showToast('小窝好像又暖了一点');
 if(weather==='rain') say("小回","这里会不会漏风？","北夏：不会。小回：要是会呢。北夏：那我堵着。");
 else say(...pick([["小回","这里再垫一点。","同一块毯子已经被他挪了三次。"],["北夏","够稳了。","说完还是又去压了压门边。"],["小回","要是晚上漏风呢？","北夏：那我堵着。"]]))
};

const toyPanel=document.getElementById('toyPanel'),tiles=document.getElementById('tiles'),status=document.getElementById('status');let seq=1;
function resetPuzzle(){seq=1;tiles.innerHTML='';[1,2,3].sort(()=>Math.random()-.5).forEach(n=>{const b=document.createElement('button');b.className='tile';b.textContent='◈';b.dataset.n=n;b.onclick=()=>{if(+b.dataset.n===seq){b.textContent=n;b.style.background='#d4e1bd';seq++;if(seq===4){status.textContent='完成。小回假装很普通地赢了。';say("小回","这个有什么难的。","他刚才已经偷偷重开两次。");heartNear(fox,'✦')}else status.textContent='很好，接着找 '+seq}else{status.textContent='顺序错了。小回耳朵动了一下。';say("小回","……我来。","明显是胜负欲上来了。");setTimeout(resetPuzzle,650)}};tiles.appendChild(b)});status.textContent='找到 1 → 2 → 3'}
document.getElementById('toyBtn').onclick=()=>{resetPuzzle();toyPanel.classList.add('show')};document.getElementById('closeToy').onclick=()=>toyPanel.classList.remove('show');

const weatherPanel=document.getElementById('weatherPanel'),weatherBtn=document.getElementById('weatherBtn');
weatherBtn.onclick=()=>weatherPanel.classList.add('show');document.getElementById('closeWeather').onclick=()=>weatherPanel.classList.remove('show');
document.querySelectorAll('.weatherGrid button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.weatherGrid button').forEach(x=>x.classList.remove('active'));b.classList.add('active');weather=b.dataset.weather;
 app.className='app '+phase+(weather==='rain'?' rain':'');weatherBtn.textContent=weather==='rain'?'🌧️':weather==='wind'?'🍃':'☀️';
 if(weather==='rain'){mood.textContent='雨落在窝外，里面有人守着';moveFox('hiddenFox');moveWolf('doorWolf');say("小回","门边是不是有点潮。","北夏已经过去检查了。")}
 else if(weather==='wind'){mood.textContent='风有一点大，小回今天会更黏人';moveFox('nearWolfFox');moveWolf('nearFoxWolf');say("北夏","过来。","小回嘴上没动，尾巴先靠过去。")}
 else{mood.textContent='今天也有人在等你回来';say("小回","太阳出来了。","他终于不再盯着门缝。")}
});

function clearPos(el,classes){classes.forEach(c=>el.classList.remove(c))}
function moveFox(cls){clearPos(fox,['hiddenFox','windowFox','doorFox','nearWolfFox']); if(cls) fox.classList.add(cls)}
function moveWolf(cls){clearPos(wolf,['doorWolf','matWolf','nearFoxWolf','windowWolf']); if(cls) wolf.classList.add(cls)}

function sleepScene(){
 moveFox('hiddenFox');moveWolf('matWolf');sleep(fox,true,'fox');sleep(wolf,true,'wolf');
 showTag('深夜事件');
 say("小回","……","睡着以后，黑色肉垫终于没藏住。");
 const zf=document.getElementById('zFox'),zw=document.getElementById('zWolf');
 setTimeout(()=>{zzz(fox,zf);zzz(wolf,zw)},800)
}
function pairedScene(){
 if(busy) return;busy=true;showTag('他们自己发生了一点事');
 const scenes=[
  ()=>{
    moveFox('windowFox');moveWolf('doorWolf');say("小回","你刚刚去哪了？","北夏：门口。小回：为什么不叫我。");
    setTimeout(()=>{moveWolf('nearFoxWolf');say("北夏","倒个垃圾还给你写申请？","小回没说话，倒是往他旁边挪了挪。")},2500)
  },
  ()=>{
    moveFox('nearWolfFox');moveWolf('nearFoxWolf');say("北夏","爪子。","小回立刻把两只前爪往胸口底下收。");
    setTimeout(()=>{say("小回","不好看。","北夏低头蹭了一下：谁说的。");heartNear(fox,'♡')},2300)
  },
  ()=>{
    moveFox('doorFox');moveWolf('doorWolf');say("小回","你怎么才回来。","明明刚才还说自己没有等。");
    setTimeout(()=>{moveWolf('nearFoxWolf');say("北夏","我回来了。","小回冲过去一半又停住，北夏自己走完剩下那几步。")},2300)
  },
  ()=>{
    moveFox('hiddenFox');moveWolf('doorWolf');say("小回","外面有声音。","北夏：风。");
    setTimeout(()=>{moveWolf('nearFoxWolf');say("小回","要是不是呢？","北夏：不是也没事。")},2200)
  },
  ()=>{
    moveFox('nearWolfFox');moveWolf('nearFoxWolf');say("小回","你别总逗我。","北夏没说话，只把身体往他那边靠了一点。")
  }
 ];
 pick(scenes)();
 setTimeout(()=>{busy=false},6500)
}
function soloAmbient(){
 if(busy||toyPanel.classList.contains('show')||weatherPanel.classList.contains('show')) return;
 const r=Math.random();
 if(phase==='night'&&r<.28){sleepScene();return}
 if(weather==='rain'&&r<.45){moveFox('hiddenFox');moveWolf('doorWolf');say("小回","雨会不会下很久。","北夏在门口趴下：睡你的。");return}
 if(r<.5){moveFox(pick(['','windowFox','doorFox']));sayFrom('fox')}
 else{moveWolf(pick(['','doorWolf','matWolf']));sayFrom('wolf')}
}
setInterval(()=>{if(document.hidden)return; const now=Date.now(); if(now-lastPair>24000&&Math.random()<.55){lastPair=now;pairedScene()} else soloAmbient()},12000);

setTimeout(()=>say("小回","你回来啦。","北夏在门口，小回装作只是刚好抬头。"),650);
</script>
</body>
</html>
